name: vim-parser

on:
  pull_request:
    branches: [ main ]
    paths:
      - 'java/vim-parser/**'
      - '.github/workflows/vim-parser.yml'
  push:
    branches: [ main ]
    paths:
      - 'java/vim-parser/**'
      - '.github/workflows/vim-parser.yml'
  workflow_dispatch:

permissions:
  contents: read
  packages: read

concurrency:
  group: vim-parser-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: vim-parser
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          # writes settings.xml with server "github" (repository id in the poms)
          server-id: github
          server-username: GITHUB_ACTOR
          server-password: GITHUB_TOKEN

      # TK stemmer tests need the native TK library, which the runner does not have
      - name: Build and test
        working-directory: java/vim-parser
        run: >-
          mvn -B -ntp verify
          -Dtest='!org.cassandragargoyle.tk.**,!**.TKBackendTest'
          -Dsurefire.failIfNoSpecifiedTests=false
