name: vim-parser

on:
  pull_request:
    branches: [ main ]
    paths:
      - 'java/vim-parser/**'
      - '.github/workflows/vim-parser.yml'
  push:
    branches: [ main ]
    paths:
      - 'java/vim-parser/**'
      - '.github/workflows/vim-parser.yml'
  workflow_dispatch:

permissions:
  contents: read
  packages: read

concurrency:
  group: vim-parser-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: vim-parser
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          # settings.xml is written by the next step (two GitHub Packages servers)
          overwrite-settings: false

      # Server ids match the repository ids in java/vim-parser/pom.xml
      - name: Configure GitHub Packages credentials
        run: |
          mkdir -p ~/.m2
          cat > ~/.m2/settings.xml <<'EOF'
          <settings>
            <servers>
              <server>
                <id>github-portunix-api</id>
                <username>${env.GITHUB_ACTOR}</username>
                <password>${env.GITHUB_TOKEN}</password>
              </server>
              <server>
                <id>github-portunix-table-detector</id>
                <username>${env.GITHUB_ACTOR}</username>
                <password>${env.GITHUB_TOKEN}</password>
              </server>
            </servers>
          </settings>
          EOF

      # TK stemmer tests need the native TK library, which the runner does not have
      - name: Build and test
        working-directory: java/vim-parser
        run: >-
          mvn -B -ntp verify
          -Dtest='!org.cassandragargoyle.tk.**,!**.TKBackendTest'
          -Dsurefire.failIfNoSpecifiedTests=false
